---
name: PR Checks
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
permissions:
  contents: write
  pull-requests: write
jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    steps:
      - uses: thehanimo/pr-title-checker@v1.4.3
        id: check
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pass_on_octokit_error: false
      - name: Add comment to fix PR title
        uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ steps.check.outputs.success == 'false'}}
        with:
          header: PR Title Check
          recreate: true
          message: |
            ### 🚨 PR Title Needs Formatting
            The title of this PR needs to be formatted correctly following [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).
            Please update the title to match the format `type(scope): description`. Examples:
            * `fix(readme): fix typo in README.md`
            * `chore(dependencies): update dependencies`
            * `feat(feature): add new feature`
      - name: Add comment that PR title is fixed
        if: ${{ steps.check.outputs.success == 'true'}}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: PR Title Check
          recreate: true
          message: |
            ### ✅ PR Title Formatted Correctly
            The title of this PR has been updated to match the correct format. Thank you!
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: latest
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: download artifact (master.breakdown)
        id: download-master-breakdown
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151  # v21
        with:
          branch: master
          workflow_conclusion: success
          name: master.breakdown
          if_no_artifact_found: warn
      - name: Run tests with coverage
        id: run-tests
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic -coverpkg=./...
      - name: check test coverage
        uses: vladopajic/go-test-coverage@a93b868a4cbcbf18dc3781650fad241f0020e609  # v2.18.8
        continue-on-error: true
        id: coverage
        with:
          config: ./.testcoverage.yaml
          breakdown-file-name: ${{ github.ref_name == 'master' && 'master.breakdown' || 'feature.breakdown' }}
          diff-base-breakdown-file-name: ${{ steps.download-master-breakdown.outputs.found_artifact == 'true' && 'master.breakdown' || '' }}
          # Generate and push the coverage badge to the `badges` branch, but only
          # on master pushes (PRs from forks lack write access anyway).
          git-token: ${{ github.ref_name == 'master' && github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges
      - name: upload artifact (master.breakdown)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: github.ref_name == 'master' && github.event_name == 'push'
        with:
          name: master.breakdown
          path: master.breakdown  # as specified via `breakdown-file-name`
          if-no-files-found: error
      - name: Post coverage report comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: Coverage Report
          recreate: true
          message: |
            ### Coverage Report
            ```
            ${{ fromJSON(steps.coverage.outputs.report) }}```
      - name: finally check coverage
        if: steps.coverage.outcome == 'failure'
        shell: bash
        run: echo "coverage check failed" && exit 1
