---
on:
  pull_request:
    paths:
      - '**/*.md'
      - .github/workflows/lint-markdown.yaml
name: Lint markdown files
concurrency:
  group: lint-markdown-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint-md:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          install: true
      - name: Lint markdown files on changed files
        run: |-
          files=$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}"..."${{ github.sha }}" | grep -E '\.md$' || true)
          if [ -z "$files" ]; then
            echo "No markdown files changed"
          else
            echo "Changed markdown files:"
            echo "$files"
            mise exec -- markdownlint-cli2 --config .markdownlint-cli2.jsonc $files
          fi
