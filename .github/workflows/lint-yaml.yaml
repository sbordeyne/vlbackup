---
name: Run yamllint
on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '*.yaml'
      - '**/*.yml'
      - '*.yml'
concurrency:
  group: lint-yaml-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          install: true
      - name: Run yamllint on changed files
        run: |-
          files=$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}"..."${{ github.sha }}" | grep -E '\.(yaml|yml)$' || true)
          if [ -z "$files" ]; then
            echo "No YAML files changed"
          else
            echo "Changed YAML files:"
            echo "$files"
            mise exec -- yamllint --config-file=.yamllint.yaml --format=github $files
          fi
