---
name: Docs
on:
  push:
    branches:
      - master
    tags:
      - v*
    paths:
      - docs/**
      - openapi/**
      - properdocs.yml
      - mise.toml
      - .github/workflows/docs.yaml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so git-revision-date-localized can read commit dates.
          fetch-depth: 0
      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          install: true
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Make previously published versions visible to mike so it appends
      # rather than starting the gh-pages history over.
      - name: Fetch existing gh-pages
        run: git fetch origin gh-pages --depth=1 || true
      - name: Build (strict)
        run: mise run docs:build
      - name: Deploy versioned docs
        run: |-
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            mise exec -- mike deploy --push --update-aliases "$GITHUB_REF_NAME" latest
            mise exec -- mike set-default --push latest
          else
            mise exec -- mike deploy --push dev
          fi
